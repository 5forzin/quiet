<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Desktop</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><img class="mark" src="icons/icon-48.png" alt="" width="28" height="28"><strong>Quiet</strong><span id="connection">Offline</span><button id="connect" type="button" class="icon-button" aria-label="Reconnect" title="Reconnect"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6 6 0 1 0 0 5M16 3v5h-5"/></svg></button></header>
    <div class="section-heading"><h1>Sessions</h1><span id="count">Loading…</span></div>
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><span class="sr-only">Search sites</span><input id="search" type="search" placeholder="Search sites" autocomplete="off"></label>
    <div class="selection"><label><input id="all" type="checkbox" checked> All sites</label></div>
    <div id="sites" aria-label="Sites with stored cookies"></div>
    <p id="unsupported" class="detail" hidden></p>
    <p class="privacy">Share selected sign-in cookies with your local agent.</p>
    <button id="share" type="button" disabled>Share sessions</button>
    <p id="status" role="status">Connecting…</p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
